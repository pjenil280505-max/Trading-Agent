[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-market-os"
version = "0.1.0"
description = "Local-first, zero-cost market intelligence, charting, backtesting and paper-trading platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Open Market OS contributors" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "numpy>=2.0",
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.8",
  "keyring>=25",
  "cryptography>=43",
  "psutil>=6",
  "mcp>=2.0",
  "defusedxml>=0.7",
  "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "coverage>=7",
  "ta>=0.11",
  "pandas>=2.2",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "pip-licenses>=5",
  "detect-secrets>=1.5",
  "pyinstaller>=6",
]

[project.scripts]
omos = "omos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omos = ["storage/migrations/*.sql", "web/dist/**/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 120
markers = [
  "network: hits real public data sources (deselect with -m 'not network')",
  "e2e: browser end-to-end tests (need built UI and Chromium)",
  "slow: long-running tests",
]
addopts = "-ra"
