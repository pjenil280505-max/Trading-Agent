# Open Market OS: test, build the installers on real Windows / macOS / Linux machines, install each
# one the way a user would, smoke-test the installed app, uninstall, and collect everything (with
# SHA-256 checksums) into a DRAFT GitHub release. Nothing is published automatically.
name: Open Market OS build

on:
  push:
    branches: [ccr-80d6e707-jb6y48]
    paths: ['open-market-os/**', '.github/workflows/omos-build.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omos-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: open-market-os

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  test:
    name: Tests (unit, integration, browser E2E)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python -m pip install --prefer-binary -e ".[dev]"
      - run: bash scripts/build_web.sh
      - run: python -m pytest -q -p no:cacheprovider
      - name: Browser end-to-end tests
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          OMOS_PY="$(command -v python)" bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-failures, path: open-market-os/e2e-artifacts, if-no-files-found: ignore }

  linux:
    name: Linux ${{ matrix.arch }} (.deb, AppImage, tar.gz)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python -m pip install --prefer-binary -e ".[dev]"
      - run: echo "OMOS_VERSION=$(python -c 'import omos; print(omos.__version__)')" >> "$GITHUB_ENV"
      - run: bash scripts/build_web.sh
      - run: python packaging/build_app.py
      - name: Smoke test the built app
        run: python packaging/smoke_test.py --launcher "dist/Open Market OS/open-market-os" --cli "dist/Open Market OS/omos" --expect-version "$OMOS_VERSION"
      - run: sudo apt-get update -q && sudo apt-get install -y -q desktop-file-utils libfuse2
      - run: bash packaging/linux/make_packages.sh releases
      - name: Install the .deb, smoke test, remove it
        run: |
          sudo apt-get install -y ./releases/open-market-os_*.deb
          desktop-file-validate /usr/share/applications/open-market-os.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/open-market-os.png
          python packaging/smoke_test.py --launcher /usr/bin/open-market-os --cli /usr/bin/omos --expect-version "$OMOS_VERSION"
          sudo apt-get remove -y open-market-os
          test ! -e /opt/open-market-os && test ! -e /usr/bin/omos
          echo "removed cleanly"
      - name: Smoke test the AppImage
        run: |
          chmod +x releases/*.AppImage
          python packaging/smoke_test.py --launcher "$(ls releases/*.AppImage)" --expect-version "$OMOS_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: omos-linux-${{ matrix.arch }}
          path: open-market-os/releases/*
          if-no-files-found: error

  windows:
    name: Windows x64 (installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python -m pip install --prefer-binary -e ".[dev]"
      - run: echo "OMOS_VERSION=$(python -c 'import omos; print(omos.__version__)')" >> "$GITHUB_ENV"
      - run: bash scripts/build_web.sh
      - run: python packaging/build_app.py
      - name: Smoke test the built app (Windows Credential Manager for secrets)
        run: python packaging/smoke_test.py --launcher "dist/Open Market OS/Open Market OS.exe" --cli "dist/Open Market OS/omos.exe" --expect-version "$OMOS_VERSION" --keyring
      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:OMOS_VERSION" "packaging\windows\open-market-os.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem releases
      - name: Install silently with shortcuts and start at sign-in
        shell: pwsh
        run: |
          $setup = (Get-ChildItem releases\*-setup.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon,autostart','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; exit 1 }
          $app = "$env:LOCALAPPDATA\Programs\Open Market OS"
          $paths = @("$app\Open Market OS.exe", "$app\omos.exe",
                     "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Open Market OS.lnk",
                     "$([Environment]::GetFolderPath('Desktop'))\Open Market OS.lnk")
          foreach ($f in $paths) { if (Test-Path $f) { "found $f" } else { Write-Error "missing $f"; exit 1 } }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').OpenMarketOS
          if (-not $run) { Write-Error 'start-at-sign-in entry missing'; exit 1 }
          "start at sign-in: $run"
          if ($run -notmatch 'Open Market OS\.exe') { Write-Error 'autostart must use the windowed app'; exit 1 }
      - name: Smoke test the installed app
        run: |
          APP="$LOCALAPPDATA/Programs/Open Market OS"
          python packaging/smoke_test.py --launcher "$APP/Open Market OS.exe" --cli "$APP/omos.exe" --expect-version "$OMOS_VERSION"
      - name: Update while the app is running (installer stops it, data survives)
        shell: pwsh
        run: |
          $env:OMOS_NO_BROWSER = '1'
          $app = "$env:LOCALAPPDATA\Programs\Open Market OS"
          (Start-Process "$app\Open Market OS.exe" -PassThru).WaitForExit()  # -Wait would also wait for the background host
          $port = (Get-Content "$env:LOCALAPPDATA\OpenMarketOS\host.runtime.json" | ConvertFrom-Json).port
          (Invoke-RestMethod "http://127.0.0.1:$port/api/health").status
          $setup = (Get-ChildItem releases\*-setup.exe)[0].FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=update.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content update.log -Tail 60; exit 1 }
          try { Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 3; Write-Error 'app was not stopped for the update'; exit 1 } catch { 'app was stopped for the update' }
          (Start-Process "$app\Open Market OS.exe" -PassThru).WaitForExit()  # -Wait would also wait for the background host
          (Invoke-RestMethod "http://127.0.0.1:$port/api/health").status
          if (-not (Test-Path "$env:LOCALAPPDATA\OpenMarketOS\omos.db")) { Write-Error 'data lost in update'; exit 1 }
          & "$app\omos.exe" stop
          & "$app\omos.exe" autostart on --quiet   # the uninstaller must remove this again
      - name: Uninstall (app removed, user data kept)
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Programs\Open Market OS"
          $un = (Get-ChildItem "$app\unins*.exe")[0].FullName
          Start-Process $un -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 90 -and (Test-Path "$app\Open Market OS.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$app\Open Market OS.exe") { Write-Error 'app files still present'; exit 1 }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Open Market OS.lnk") { Write-Error 'start menu shortcut left'; exit 1 }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').OpenMarketOS) { Write-Error 'start-at-sign-in entry left'; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\OpenMarketOS\omos.db")) { Write-Error 'user data was deleted'; exit 1 }
          'uninstalled; user data kept'
      - uses: actions/upload-artifact@v4
        with: { name: omos-windows-x64, path: open-market-os/releases/*, if-no-files-found: error }

  macos:
    name: macOS ${{ matrix.arch }} (.dmg)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python -m pip install --prefer-binary -e ".[dev]"
      - run: echo "OMOS_VERSION=$(python -c 'import omos; print(omos.__version__)')" >> "$GITHUB_ENV"
      - run: bash scripts/build_web.sh
      - run: python packaging/build_app.py
      - name: Smoke test the built app
        run: python packaging/smoke_test.py --launcher "dist/Open Market OS.app/Contents/MacOS/Open Market OS" --cli "dist/Open Market OS.app/Contents/MacOS/omos" --expect-version "$OMOS_VERSION"
      - run: bash packaging/macos/make_dmg.sh releases
      - name: Install from the disk image and smoke test the installed app
        run: |
          DMG="$(ls releases/*.dmg)"
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/omos-dmg
          test -e "/tmp/omos-dmg/Applications" && test -f "/tmp/omos-dmg/READ ME FIRST.txt"
          mkdir -p "$HOME/Applications"
          cp -R "/tmp/omos-dmg/Open Market OS.app" "$HOME/Applications/"
          hdiutil detach /tmp/omos-dmg
          APP="$HOME/Applications/Open Market OS.app"
          codesign --verify --deep --strict "$APP" && echo "signature valid (ad hoc)"
          spctl --assess --type execute "$APP" 2>&1 || echo "Gatekeeper: not notarized (expected; users confirm once in Privacy & Security)"
          python packaging/smoke_test.py --launcher "$APP/Contents/MacOS/Open Market OS" --cli "$APP/Contents/MacOS/omos" --expect-version "$OMOS_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: omos-macos-${{ matrix.arch }}
          path: open-market-os/releases/*
          if-no-files-found: error

  android:
    name: Android app (APK, emulator end-to-end)
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: write   # keeps the app's signing key in a private draft release (see the signing step)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: python -m pip install --prefer-binary -e ".[dev]"
      - run: echo "OMOS_VERSION=$(python -c 'import omos; print(omos.__version__)')" >> "$GITHUB_ENV"
      - run: bash scripts/build_web.sh
      - name: Android SDK packages
        run: |
          set +o pipefail   # 'yes' is cut off by a closed pipe when sdkmanager finishes
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          test -d "$ANDROID_HOME/platforms/android-35" && test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Signing key (created once by this workflow, kept in a private draft release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KEYDIR="$RUNNER_TEMP/omos-signing"; mkdir -p "$KEYDIR"; chmod 700 "$KEYDIR"
          REL="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft and .tag_name == "android-signing-key-private") | .id' | head -1)"
          if [ -z "$REL" ]; then
            PW="$(openssl rand -hex 24)"
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KEYDIR/omos-release.jks" -storetype PKCS12 -alias omos -keyalg EC \
              -groupname secp256r1 -validity 10000 -dname "CN=Open Market OS, O=Open Market OS" -storepass "$PW" -keypass "$PW"
            printf 'storePassword=%s\nkeyAlias=omos\nkeyPassword=%s\n' "$PW" "$PW" > "$KEYDIR/signing-secrets.properties"
            REL="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name=android-signing-key-private \
              -f name="Android signing key - PRIVATE, DO NOT PUBLISH" -F draft=true --jq .id \
              -f body="Private draft, visible only to people with write access. It holds the key that signs the Open Market OS Android app, so new versions install as updates. The build workflow reads it. Never publish this draft. See open-market-os/android/README.md.")"
            for f in omos-release.jks signing-secrets.properties; do
              gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$REL/assets?name=$f" \
                -H "Content-Type: application/octet-stream" --input "$KEYDIR/$f" > /dev/null
            done
            echo "created a new signing key"
          else
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/$REL/assets" --jq '.[].id'); do
              name="$(gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" --jq .name)"
              gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$KEYDIR/$name"
            done
            echo "::add-mask::$(grep storePassword "$KEYDIR/signing-secrets.properties" | cut -d= -f2-)"
            echo "using the existing signing key"
          fi
          { echo "storeFile=$KEYDIR/omos-release.jks"; cat "$KEYDIR/signing-secrets.properties"; } > android/signing.properties
          keytool -list -keystore "$KEYDIR/omos-release.jks" -storepass "$(grep storePassword "$KEYDIR/signing-secrets.properties" | cut -d= -f2-)" | grep -i "SHA-256" || true
      - name: Unit tests, lint, signed release build
        working-directory: open-market-os/android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Check the signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | grep -vi "warning" | head -20
          mkdir -p releases
          cp "$APK" "releases/OpenMarketOS-${OMOS_VERSION}-android.apk"
          rm -f android/signing.properties
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: End-to-end on an Android emulator (pair, pinned HTTPS, signed in; wrong certificate refused)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: open-market-os
          script: bash scripts/android_e2e.sh releases/OpenMarketOS-${{ env.OMOS_VERSION }}-android.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e-screens
          path: open-market-os/e2e-artifacts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: omos-android
          path: open-market-os/releases/*
          if-no-files-found: error

  release:
    name: Draft release with checksums
    needs: [test, linux, windows, macos, android]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: omos-*, path: open-market-os/releases, merge-multiple: true }
      - name: Checksums
        run: |
          cd releases
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "OMOS_VERSION=$(cd .. && python3 -c 'import sys; sys.path.insert(0, "src"); import omos; print(omos.__version__)')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with: { name: open-market-os-all, path: open-market-os/releases/* }
      - name: Replace the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${OMOS_VERSION}"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Open Market OS ${OMOS_VERSION}" \
            --notes-file docs/RELEASE_NOTES.md releases/*
