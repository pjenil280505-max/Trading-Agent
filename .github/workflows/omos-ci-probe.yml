name: omos-ci-probe
on:
  push:
    branches: [ccr-80d6e707-jb6y48]
    paths: ['.github/workflows/omos-ci-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04-arm, macos-15-intel, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - shell: bash
        run: echo "runner ok"; uname -a; python3 --version || true; ls "/c/Program Files (x86)/Inno Setup 6" 2>/dev/null | head -3 || true
